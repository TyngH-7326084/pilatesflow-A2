$kind: http-request
name: Admin sets tier to premium
description: "US2.4: an admin can set a member's tier to premium"
url: "{{baseUrl}}/members/{{memberId}}"
method: PUT
body:
  type: json
  content: '{ "tier": "premium" }'
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("tier is premium", () => pm.expect(pm.response.json().tier).to.eql("premium"));
    language: text/javascript
order: 11000