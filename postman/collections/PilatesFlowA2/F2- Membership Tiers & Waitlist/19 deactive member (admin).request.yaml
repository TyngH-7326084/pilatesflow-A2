$kind: http-request
name: deactivate member (admin)
description: "US2.3: an admin token can deactivate a member"
url: "{{baseUrl}}/members/{{memberId}}/deactivate"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("status is inactive", () => pm.expect(pm.response.json().status).to.eql("inactive"));    
    language: text/javascript
order: 19000