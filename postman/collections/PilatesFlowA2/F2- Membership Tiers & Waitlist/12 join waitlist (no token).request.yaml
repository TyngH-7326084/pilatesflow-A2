$kind: http-request
name: Join waitlist (no token)
description: "US2.5: a user can join the waitlist without a token"
url: "{{baseUrl}}/waitlist"
method: POST
body:
  type: json
  content: '{ "classId": "{{fullClassId}}" }'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 12000