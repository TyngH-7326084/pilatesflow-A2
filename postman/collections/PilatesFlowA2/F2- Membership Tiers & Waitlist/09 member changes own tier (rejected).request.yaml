$kind: http-request
name: Member change own tier (rejected)
description: "US2.4 & NFR-F2: a member cannot change their own tier"
url: "{{baseUrl}}/members/{{memberId}}"
method: PUT
body:
  type: json
  content: '{ "tier": "premium" }'
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 9000
