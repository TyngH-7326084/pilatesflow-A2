$kind: http-request
name: Join waitlist again (duplicate)
description: "US2.5: a user can join the waitlist once, but not twice"
url: "{{baseUrl}}/waitlist"
method: POST
body:
  type: json
  content: '{ "classId": "{{fullClassId}}" }'
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 409", () => pm.response.to.have.status(409)); 
    language: text/javascript
order: 15000