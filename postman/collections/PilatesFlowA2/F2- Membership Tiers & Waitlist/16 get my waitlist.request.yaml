$kind: http-request
name: get my waitlist
description: "US2.6: a member sees their waitlist entries"
url: "{{baseUrl}}/waitlist/mine"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("has one entry", () => pm.expect(pm.response.json()).to.have.lengthOf(1));
      pm.environment.set("waitlistEntryId", pm.response.json()[0]._id);
    language: text/javascript
order: 16000