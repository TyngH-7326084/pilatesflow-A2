$kind: http-request
name: Deactivated member joins waitlist (rejected)
description: "US2.3: a deactivated member cannot join a waitlist."
url: "{{baseUrl}}/waitlist"
method: POST
body:
  type: json
  content: '{ "classId": "{{fullClassId}}" }'
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 20000