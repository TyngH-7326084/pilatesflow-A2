$kind: http-request
name: Join waitlist (full class)
description: "US2.5: joining a full class"
url: "{{baseUrl}}/waitlist"
method: POST
body:
  type: json
  content: '{ "classId": "{{fullClassId}}" }'
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 201", () => pm.response.to.have.status(201));
      pm.test("position is 1", () => pm.expect(pm.response.json().position).to.eql(1));
    language: text/javascript
order: 14000