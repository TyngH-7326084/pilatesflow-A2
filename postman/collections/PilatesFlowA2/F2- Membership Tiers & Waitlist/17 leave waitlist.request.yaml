$kind: http-request
name: leave waitlist
description: "US2.7: a member can leave the waitlist"
url: "{{baseUrl}}/waitlist/{{waitlistEntryId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 17000