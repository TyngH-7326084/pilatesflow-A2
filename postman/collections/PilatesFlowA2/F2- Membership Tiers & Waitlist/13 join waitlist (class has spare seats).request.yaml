$kind: http-request
name: Join waitlist (class has spare seats)
description: "US2.5: a user can join the waitlist even if the class has spare seats"
url: "{{baseUrl}}/waitlist"
method: POST
body:
  type: json
  content: '{ "classId": "{{openClassId}}" }'
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 400", () => pm.response.to.have.status(400)); 
    language: text/javascript
order: 13000