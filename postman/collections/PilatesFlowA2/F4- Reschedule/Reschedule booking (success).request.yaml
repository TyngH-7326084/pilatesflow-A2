$kind: http-request
name: Reschedule booking (success)
description: Moves the authenticated member's existing booking to another future
  class with space while retaining the booking ID.
url: "{{baseUrl}}/bookings/{{bookingId}}/reschedule"
method: PATCH
body:
  type: json
  content: '{ "targetClassId": "{{targetClassId}}" }'
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 1790498912059
