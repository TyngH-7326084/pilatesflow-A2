name: PilatesFlow CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilatesflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  verify-and-package:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Check server JavaScript syntax
        working-directory: server
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run server tests and retain terminal evidence
        working-directory: server
        shell: bash
        run: |
          mkdir -p test-results
          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test 2>&1 | tee test-results/server-tests.txt
          else
            echo "::notice title=Backend tests pending::No server test script exists yet. Feature test Jira items must add it before final assessment evidence is collected."
          fi

      - name: Upload server test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-evidence-${{ github.sha }}
          path: server/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build production client
        working-directory: client
        run: npm run build

      - name: Run client lint as a visible baseline check
        continue-on-error: true
        working-directory: client
        run: npm run lint

      - name: Package tested release
        shell: bash
        run: |
          mkdir -p artifact
          tar -czf "artifact/pilatesflow-${GITHUB_SHA}.tar.gz" \
            client/dist \
            server/src \
            server/package.json \
            server/package-lock.json \
            ecosystem.config.cjs
          cp .github/scripts/deploy-ec2.sh artifact/deploy-ec2.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilatesflow-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to ${{ matrix.target }}
    needs: verify-and-package
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # Runs on the self-hosted runners installed on each EC2 instance (Tutorial 6),
    # so no inbound SSH from GitHub is needed.
    runs-on: [self-hosted, "${{ matrix.target }}"]
    timeout-minutes: 15
    environment: production
    strategy:
      fail-fast: true
      max-parallel: 1 # rolling deploy: one instance at a time so the ALB always has a healthy target
      matrix:
        target: [pf-a2-1, pf-a2-2]
    env:
      APP_ROOT: ${{ vars.EC2_APP_ROOT || '/var/www/pilatesflow-a2' }}
      APP_PORT: ${{ vars.APP_PORT || '3000' }}
      PM2_HOME: /home/ec2-user/.pm2

    steps:
      - name: Clear previous release files
        run: rm -rf artifact

      - name: Download tested release
        uses: actions/download-artifact@v5
        with:
          name: pilatesflow-${{ github.sha }}
          path: artifact

      - name: Deploy and health-check this target
        shell: bash
        run: |
          cp "artifact/pilatesflow-${GITHUB_SHA}.tar.gz" "/tmp/pilatesflow-${GITHUB_SHA}.tar.gz"
          bash artifact/deploy-ec2.sh "$GITHUB_SHA" "$APP_ROOT" "$APP_PORT"